name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax check
        run: |
          set -e
          for f in ./*.js; do node --check "$f"; done

      - name: JSON/config validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));"

      - name: Canonical runtime assets
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mustExist=['index.html','styles.css','app.js','core-boot.js','navigation-shell.js','secure-sync-bridge.js','game-engine-v6.js','security-center.js','level2-auth-v2.js'];
          for(const f of mustExist) if(!fs.existsSync(f)) throw new Error('Missing canonical asset: '+f);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.version!=='0.20.3') throw new Error('Unexpected package version: '+pkg.version);
          const index=fs.readFileSync('index.html','utf8');
          const core=fs.readFileSync('core-boot.js','utf8');
          const game=fs.readFileSync('game-engine-v6.js','utf8');
          const server=fs.readFileSync('server.js','utf8');
          const docker=fs.readFileSync('Dockerfile','utf8');
          const checks=[
            ['game engine boot',core,'game-engine-v6.js'],
            ['navigation shell boot',index,'navigation-shell.js'],
            ['safe session start',game,'CCNER_SAFE_START_SESSION'],
            ['stable session ids',game,'crypto.randomUUID'],
            ['build version server',server,'0.20.3'],
            ['build version docker',docker,'BUILD_VERSION=0.20.3'],
            ['single exit control',game,'v6Exit'],
            ['game exit event',game,'ccner:game-session-exit']
          ];
          for(const [label,text,needle] of checks) if(!text.includes(needle)) throw new Error('Missing '+label+': '+needle);
          for(const forbidden of ['phase4.js','game-controls.js','game-engine-adaptive','game-set-override.js'])
            if(index.includes(forbidden)) throw new Error('Obsolete runtime reference: '+forbidden);
          console.log('Canonical runtime checks passed.');
          NODE
      - name: Navigation and accessibility checks
        run: |
          set -e
          grep -q 'aria-expanded' navigation-shell.js
          grep -q 'aria-modal="true"' navigation-shell.js
          grep -q "e.key==='Escape'" navigation-shell.js
          grep -q 'inert=true' navigation-shell.js
          grep -q 'overscroll-behavior:contain' styles.css
          grep -q 'id="topMenuButton"' index.html
          grep -q '"webDir": "dist"' capacitor.config.json

      - name: Security checks
        run: |
          set -e
          grep -q 'Content-Security-Policy' index.html
          grep -q "script-src 'self' https://cdn.jsdelivr.net" server.js
          grep -q "script-src-attr 'none'" server.js
          grep -q "X-Content-Type-Options.*nosniff" server.js
          grep -q "X-Frame-Options.*DENY" server.js
          grep -q "Referrer-Policy.*strict-origin-when-cross-origin" server.js
          if grep -RInE "sk-[A-Za-z0-9_-]{20,}|service_role|SUPABASE_SERVICE_ROLE_KEY" --include='*.js' --include='*.json' .; then
            echo "Potential secret pattern found"
            exit 1
          fi

      - name: Root static asset reference check
        run: |
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('index.html','utf8')+'\n'+fs.readFileSync('core-boot.js','utf8');
          const refs=[...text.matchAll(/(?:src|href)=["']\.\/([^?"']+)/g)].map(m=>m[1]);
          for(const ref of refs){
            if(!fs.existsSync(ref)) throw new Error('Missing root asset: '+ref);
          }
          console.log('Validated '+refs.length+' root asset references.');
          NODE

      - name: Docker build and HTTP smoke test
        run: |
          set -euxo pipefail
          IMAGE="cognitive-care-ner:$GITHUB_SHA"
          docker build --pull -t "$IMAGE" .
          docker run -d --name ccner-smoke -p 18080:80 "$IMAGE"
          cleanup() { docker logs ccner-smoke || true; docker rm -f ccner-smoke || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Cognitive Care NER'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'navigation-shell.js'
          test "$(docker inspect -f '{{.State.Running}}' ccner-smoke)" = "true"
