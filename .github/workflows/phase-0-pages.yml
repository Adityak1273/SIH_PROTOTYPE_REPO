name: Deploy Phase 0 Companion Prototype

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "server.js"
      - "assets/**"
      - "Dockerfile"
      - ".github/workflows/phase-0-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.svg' \) -exec cp -f {} _site/ \;
          if [ -d assets ]; then cp -R assets _site/assets; fi
          test -f _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
