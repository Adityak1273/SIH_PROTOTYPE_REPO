name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax check
        run: |
          set -e
          for f in ./*.js; do node --check "$f"; done

      - name: JSON/config validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));"

      - name: Required production assets
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f core-boot.js
          test -f notification-bridge.js
          test -f security-center.js
          test -f usability-validation.js
          test -f level2-auth.js
          grep -q "@capacitor/local-notifications" package.json
          grep -q "Content-Security-Policy" server.js

      - name: Root deployment configuration
        run: |
          set -e
          test -f Dockerfile
          test -f zopday.yaml
          test -f docker-compose.yml
          grep -q '"version": "0.20.1"' package.json
          grep -q '^ENV PORT=80$' Dockerfile
          grep -q '^ENV BUILD_VERSION=0.20.1$' Dockerfile
          grep -q "const ROOT=__dirname" server.js
          grep -q 'styles.css?v=0.20.0' index.html
          grep -q 'core-boot.js?v=0.20.0' index.html
          grep -q 'level2-auth.js?v=0.18.15' core-boot.js
          grep -q 'security-center.js?v=0.19.1' core-boot.js
          grep -q '"webDir": "."' capacitor.config.json
          grep -q 'dockerfile: Dockerfile' zopday.yaml
          grep -q '"80:80"' zopday.yaml
          grep -q '"8080:80"' docker-compose.yml

      - name: Video game session checks
        run: |
          set -e
          grep -q "Sequence Memory" game-engine-adaptive.js
          grep -q "Stroop Test" game-engine-adaptive.js
          grep -q "Around the House Sorting" game-engine-adaptive.js
          grep -q "Pattern Recognition" game-engine-adaptive.js
          grep -q "Spot the Difference" game-engine-adaptive.js
          grep -q "CCNER_VIDEO_GAMES" game-engine-adaptive.js
          grep -q "startSession" game-engine-adaptive.js

      - name: Root static asset reference check
        run: |
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('index.html','utf8')+'\n'+fs.readFileSync('core-boot.js','utf8');
          const refs=[...text.matchAll(/(?:src|href)=["']\.\/([^?"']+)/g)].map(m=>m[1]);
          for(const ref of refs){
            if(!fs.existsSync(ref)) throw new Error('Missing root asset: '+ref);
          }
          console.log('Validated '+refs.length+' root asset references.');
          NODE

      - name: Docker build and HTTP smoke test
        run: |
          set -euxo pipefail
          IMAGE="cognitive-care-ner:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          docker run -d --name ccner-smoke -p 18080:80 "$IMAGE"
          cleanup() { docker logs ccner-smoke || true; docker rm -f ccner-smoke || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Cognitive Care NER'
          test "$(docker inspect -f '{{.State.Running}}' ccner-smoke)" = "true"

      - name: Secret-pattern guard
        run: |
          if grep -RInE "sk-[A-Za-z0-9_-]{20,}|service_role|SUPABASE_SERVICE_ROLE_KEY" --include='*.js' --include='*.json' .; then
            echo "Potential secret pattern found"
            exit 1
          fi
